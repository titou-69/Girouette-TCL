<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pupitre Girouettes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

    <div class="console">

        <h2>SAEIV</h2>

        <label>Code girouette</label>

        <input
            type="number"
            id="codeInput"
            placeholder="1201"
            autofocus
        >

        <div class="infos">
            <p>Ligne : <span id="infoLigne">---</span></p>
            <p>Destination : <span id="infoDest">---</span></p>
        </div>

        <button onclick="valider()">
            VALIDER
        </button>

        <button onclick="effacer()">
            EFFACER
        </button>

    </div>

    <div class="girouette">

        <div class="ligne" id="ligne">
            ---
        </div>

        <div class="destination" id="destination">
            EN ATTENTE
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
